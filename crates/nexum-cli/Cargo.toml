[package]
name = "nexum-cli"
description = "Command-line interface for NexumDB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "nexum"
path = "src/main.rs"

[features]
default = ["local"]
# Bundles the in-process ONNX embedder, so `nexum ingest` works offline with
# no API key. Build without it for a smaller binary that relies on ollama or
# a hosted provider.
local = ["nexum-client/local", "nexum-server/local"]

[dependencies]
nexum-core.workspace = true
nexum-client.workspace = true
nexum-embed.workspace = true
nexum-ingest.workspace = true
nexum-server.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
