name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The engine, CLI, and server must build and pass on all three platforms.
  # This is the job that would have caught RocksDB's Windows toolchain
  # requirements, which is why the storage layer is pure Rust.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Keep the desktop shell out of this cache; it is built separately.
          workspaces: ". -> target"

      - name: Check formatting
        # Formatting is platform-independent, so one platform is enough.
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: Test
        run: cargo test --workspace --no-default-features

      # The bundled ONNX embedder pulls a native runtime, so it gets its own
      # build check rather than being folded into the default test run.
      - name: Build with the local embedder
        run: cargo build -p nexum-cli --features local

  viewer:
    name: Viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/viewer/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/viewer/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: apps/viewer
        run: npm ci

      - name: Typecheck
        working-directory: apps/viewer
        run: npm run typecheck

      - name: Build frontend
        working-directory: apps/viewer
        run: npx vite build

      - name: Build desktop shell
        working-directory: apps/viewer/src-tauri
        run: cargo build --locked

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit
