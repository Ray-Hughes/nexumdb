[workspace]
resolver = "3"
members = [
    "crates/nexum-core",
    "crates/nexum-embed",
    "crates/nexum-ingest",
    "crates/nexum-client",
    "crates/nexum-server",
    "crates/nexum-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/Ray-Hughes/nexumdb"
authors = ["Ray Hughes"]

[workspace.dependencies]
nexum-core = { path = "crates/nexum-core", version = "0.1.0" }
nexum-embed = { path = "crates/nexum-embed", version = "0.1.0" }
nexum-ingest = { path = "crates/nexum-ingest", version = "0.1.0" }
nexum-client = { path = "crates/nexum-client", version = "0.1.0" }
nexum-server = { path = "crates/nexum-server", version = "0.1.0" }

redb = "4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
blake3 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "signal"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rayon = "1"
parking_lot = "0.12"
half = { version = "2", features = ["serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tempfile = "3"
async-trait = "0.1"
futures = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
